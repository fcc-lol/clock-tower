<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock Tower styles</title>
    <style>
      :root {
        --tile: 240px;
        --bg: #141414;
        --panel: #262626;
        --hover: #333;
        --ink: #ededed;
        --dim: #999;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
        padding: 14px 20px;
        background: var(--bg);
      }
      h1 { margin: 0; font-size: 16px; font-weight: 650; }
      #summary { color: var(--dim); margin-right: auto; }
      label { display: inline-flex; align-items: center; gap: 7px; color: var(--dim); }
      input[type="range"] { width: 110px; accent-color: var(--ink); }
      input[type="checkbox"] { accent-color: var(--ink); }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 0;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: var(--hover); }
      button:disabled { opacity: 0.4; cursor: default; }
      button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      #notice { margin: 6px 20px 0; padding: 10px 14px; background: var(--panel); color: var(--dim); }
      #notice code { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr));
        gap: 24px 16px;
        padding: 6px 20px 20px;
      }
      .tile { min-width: 0; }
      .frame {
        position: relative;
        display: block;
        aspect-ratio: 9 / 16;
        background: #0a0a0a;
        overflow: hidden;
      }
      .frame img, .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
      .frame iframe { pointer-events: none; } /* clicks go to the link around it */
      .frame .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }
      .frame .status {
        position: absolute; inset: 0;
        display: grid; place-items: center;
        padding: 16px; text-align: center;
        background: rgba(10, 10, 10, 0.78);
        color: var(--ink);
      }
      .frame .status.failed { background: rgba(10, 10, 10, 0.95); font-size: 12.5px; overflow-wrap: anywhere; overflow: auto; }
      .frame .status.busy::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
      @media (prefers-reduced-motion: reduce) { .frame .status.busy::after { animation: none; content: "..."; } }
      .meta { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
      .meta b { font-weight: 650; }
      .meta span { color: var(--dim); font-size: 12.5px; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .meta button { padding: 3px 9px; font-size: 12.5px; }
      details { margin-top: 6px; color: var(--dim); font-size: 12.5px; }
      summary { cursor: pointer; width: fit-content; }
      details p { margin: 6px 0 0; }
      details .prompt { max-height: 16em; overflow: auto; padding: 8px 10px; background: var(--panel); color: var(--ink); }
    </style>
  </head>
  <body>
    <header>
      <h1>Styles</h1>
      <span id="summary">Loading</span>
      <label><input type="checkbox" id="readouts" checked /> Readouts</label>
      <label>Size <input type="range" id="size" min="140" max="520" step="20" value="240" /></label>
      <button id="missing" hidden>Generate missing</button>
      <button id="all" hidden>Regenerate all</button>
    </header>
    <div id="notice" hidden></div>
    <main id="grid"></main>

    <script>
      const grid = document.getElementById("grid");
      const summary = document.getElementById("summary");
      const notice = document.getElementById("notice");
      const btnMissing = document.getElementById("missing");
      const btnAll = document.getElementById("all");
      const readouts = document.getElementById("readouts");
      const size = document.getElementById("size");

      let styles = []; // [{ name, preview }]
      let canGenerate = false;
      const state = {}; // name -> { status: "queued" | "busy" | "failed", error }
      const pending = []; // names waiting to generate
      let running = false;

      const el = (tag, props, ...kids) => {
        const n = Object.assign(document.createElement(tag), props || {});
        n.append(...kids.filter((k) => k != null));
        return n;
      };

      function ago(iso) {
        if (!iso) return "";
        const m = Math.round((Date.now() - new Date(iso)) / 60000);
        if (m < 1) return "just now";
        if (m < 60) return m + "m ago";
        if (m < 60 * 24) return Math.round(m / 60) + "h ago";
        return Math.round(m / 1440) + "d ago";
      }

      function tile(s) {
        const p = s.preview;
        const st = state[s.name];
        const href = "/?preview=" + encodeURIComponent(s.name);
        const frame = el("a", { className: "frame", href, target: "_blank", title: "Open " + s.name + " full size with its readouts" });
        if (!p) frame.append(el("div", { className: "empty", textContent: "Not generated" }));
        else if (readouts.checked) frame.append(el("iframe", { src: href + "&v=" + encodeURIComponent(p.url), loading: "lazy", tabIndex: -1, title: s.name }));
        else frame.append(el("img", { src: p.url, alt: s.name + " backdrop", loading: "lazy" }));
        if (st) {
          const text = st.status === "queued" ? "Queued" : st.status === "busy" ? "Generating" : st.error;
          frame.append(el("div", { className: "status " + st.status, textContent: text }));
        }

        const regen = canGenerate
          ? el("button", { textContent: p ? "Regenerate" : "Generate", disabled: st && st.status !== "failed", onclick: () => enqueue([s.name]) })
          : null;
        const meta = el("div", { className: "meta" }, el("b", { textContent: s.name }), el("span", { textContent: p ? ago(p.createdAt) : "" }), regen);

        const out = el("div", { className: "tile" }, frame, meta);
        if (p) {
          out.append(
            el("details", null,
              el("summary", { textContent: "Prompt and layout" }),
              el("p", { textContent: "Layout: " + p.note }),
              el("p", { className: "prompt", textContent: p.prompt }),
            ),
          );
        }
        out.dataset.name = s.name;
        return out;
      }

      // Re-render one tile, keeping its details open if they were.
      function refresh(name) {
        const s = styles.find((x) => x.name === name);
        const old = grid.querySelector('[data-name="' + name + '"]');
        const fresh = tile(s);
        if (old && old.querySelector("details[open]") && fresh.querySelector("details")) fresh.querySelector("details").open = true;
        old ? old.replaceWith(fresh) : grid.append(fresh);
        header();
      }

      function header() {
        const have = styles.filter((s) => s.preview).length;
        const waiting = pending.length + (running ? 1 : 0);
        summary.textContent = have + " of " + styles.length + " generated" + (waiting ? ", " + waiting + " in the queue" : "");
        btnMissing.hidden = btnAll.hidden = !canGenerate;
        btnMissing.disabled = running || have === styles.length;
        btnAll.disabled = running;
      }

      function enqueue(names) {
        for (const name of names) {
          if (pending.includes(name) || (state[name] && state[name].status === "busy")) continue;
          pending.push(name);
          state[name] = { status: "queued" };
          refresh(name);
        }
        run();
      }

      // The server generates one at a time too; sending them one by one keeps
      // the tiles' progress honest.
      async function run() {
        if (running) return;
        running = true;
        while (pending.length) {
          const name = pending.shift();
          state[name] = { status: "busy" };
          refresh(name);
          try {
            const res = await fetch("/api/styles/" + encodeURIComponent(name) + "/generate", { method: "POST" });
            const body = await res.json();
            if (!res.ok) throw new Error(body.error || "HTTP " + res.status);
            styles.find((s) => s.name === name).preview = body;
            delete state[name];
          } catch (err) {
            state[name] = { status: "failed", error: String(err.message || err) };
            // The rest would most likely fail the same way: drop them.
            for (const other of pending.splice(0)) {
              delete state[other];
              refresh(other);
            }
          }
          refresh(name);
        }
        running = false;
        header();
      }

      btnMissing.onclick = () => enqueue(styles.filter((s) => !s.preview).map((s) => s.name));
      btnAll.onclick = () => {
        if (confirm("Regenerate all " + styles.length + " styles? Each image is billed.")) enqueue(styles.map((s) => s.name));
      };
      readouts.onchange = () => styles.forEach((s) => refresh(s.name));
      size.oninput = () => {
        document.documentElement.style.setProperty("--tile", size.value + "px");
        try { localStorage.setItem("stylesTile", size.value); } catch {}
      };
      try {
        const saved = localStorage.getItem("stylesTile");
        if (saved) { size.value = saved; size.oninput(); }
      } catch {}

      (async () => {
        try {
          const data = await (await fetch("/api/styles", { cache: "no-store" })).json();
          styles = data.styles;
          canGenerate = data.canGenerate;
          if (!canGenerate) {
            notice.hidden = false;
            notice.append(data.why + " Previews can also be made with ", el("code", { textContent: "npm run visual:preview -- all" }), ".");
          }
          styles.forEach((s) => refresh(s.name));
        } catch (err) {
          summary.textContent = "Could not load styles: " + err.message;
        }
      })();
    </script>
  </body>
</html>
