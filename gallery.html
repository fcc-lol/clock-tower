<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock Tower · gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #101010;
        --panel: #1a1a1a;
        --line: #2c2c2c;
        --ink: #f1efe9;
        --dim: #9a978f;
        --tile: 270px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.45 "Space Grotesk", system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 14px 20px;
        background: rgba(16, 16, 16, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0 auto 0 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      h1 span {
        color: var(--dim);
        font-weight: 400;
        margin-left: 8px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--dim);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      select,
      a.button {
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        text-transform: none;
        letter-spacing: 0;
        text-decoration: none;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, var(--tile));
        justify-content: center;
        gap: 26px 22px;
        padding: 26px 20px 60px;
      }
      .tile {
        width: var(--tile);
      }
      .tile a.shot {
        position: relative;
        display: block;
        width: var(--tile);
        height: calc(var(--tile) * 16 / 9);
        overflow: hidden;
        border-radius: 6px;
        background: #000;
        outline: 1px solid var(--line);
      }
      .tile iframe {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        border: 0;
        transform-origin: 0 0;
        transform: scale(calc(1 / 4));
        pointer-events: none;
      }
      .tile h2 {
        margin: 10px 0 2px;
        font-size: 16px;
        font-weight: 700;
      }
      .tile p {
        margin: 0;
        color: var(--dim);
        font-size: 13px;
      }
      .empty {
        grid-column: 1 / -1;
        color: var(--dim);
        text-align: center;
        padding: 80px 0;
      }
      @media (max-width: 640px) {
        :root {
          --tile: 162px;
        }
        .tile iframe {
          transform: scale(0.15);
        }
        header {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Clock Tower<span id="count"></span></h1>
      <label>Conditions <select id="scenario"></select></label>
      <label>Weather <select id="wx"></select></label>
      <label>Time <select id="at"></select></label>
      <a class="button" href="/">The display</a>
    </header>
    <main id="grid"></main>
    <script type="module" src="/src/gallery.js"></script>
  </body>
</html>
